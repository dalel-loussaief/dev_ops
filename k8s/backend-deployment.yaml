apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: my-backend:latest
          imagePullPolicy: Never
          env:
            - name: PORT
              value: "3000"
            - name: DB_HOST
              value: mariadb
            - name: MYSQL_USER
              value: user
            - name: MYSQL_PASSWORD
              value: test
            - name: MYSQL_DATABASE
              value: appdb
          ports:
            - containerPort: 3000
