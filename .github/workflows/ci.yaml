name: CI Pipeline

on:
  push:
    branches: [  prod]
  pull_request:
    branches: [ prod ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # ----------------------
      # Setup Node
      # ----------------------
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}

      # ----------------------
      # Backend
      # ----------------------
      - name: Install backend dependencies
        working-directory: ./backend
        run: npm install

      - name: Run backend tests
        working-directory: ./backend
        run: npm test
        continue-on-error: true

      - name: Build backend
        working-directory: ./backend
        run: npm run build || echo "No build step"

      # ----------------------
      # Frontend
      # ----------------------
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm install || echo "No package.json"

      - name: Run frontend tests
        working-directory: ./frontend
        run: npm test || echo "No tests"

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build || echo "Static HTML - no build"

      # ----------------------
      # Database check
      # ----------------------
      - name: Validate SQL schema
        run: |
          echo "Checking schema.sql..."
          if [ -f schema.sql ]; then
            cat schema.sql
          else
            echo "No schema.sql found"
          fi
